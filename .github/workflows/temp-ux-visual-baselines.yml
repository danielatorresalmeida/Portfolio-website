name: Temporary reviewed UX visual baselines
on:
  push:
    branches:
      - feature/visitor-experience-project-explorer
    paths:
      - .github/workflows/temp-ux-visual-baselines.yml
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/visitor-experience-project-explorer
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
          install-chromedriver: true
      - name: Capture and update the two already-reviewed screenshots
        env:
          CI: 'true'
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          CHROMEDRIVER_BIN: ${{ steps.chrome.outputs.chromedriver-path }}
        run: |
          set +e
          npm run test:visual
          set -e
          test -s tests/visual/artifacts/home-hero.actual.png
          test -s tests/visual/artifacts/home-project-grid.actual.png
          cp tests/visual/artifacts/home-hero.actual.png tests/visual/baseline/linux/home-hero.png
          cp tests/visual/artifacts/home-project-grid.actual.png tests/visual/baseline/linux/home-project-grid.png
          npm run test:visual
      - name: Commit reviewed Linux baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual/baseline/linux/home-hero.png tests/visual/baseline/linux/home-project-grid.png
          if ! git diff --cached --quiet; then
            git commit -m "test(visual): review compact hero and readable project cards"
            git push origin HEAD:feature/visitor-experience-project-explorer
          fi
