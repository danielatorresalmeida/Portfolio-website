name: Temporary refresh reviewed visual baselines
on:
  push:
    branches:
      - feature/refresh-online-cv-and-profile-nov2026

permissions:
  contents: write

jobs:
  update-reviewed-baselines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/refresh-online-cv-and-profile-nov2026
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
          install-chromedriver: true
      - name: Capture reviewed changed screenshots
        env:
          CI: 'true'
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          CHROMEDRIVER_BIN: ${{ steps.chrome.outputs.chromedriver-path }}
        run: |
          set +e
          npm run test:visual
          set -e
          test -s tests/visual/artifacts/home-hero.actual.png
          test -s tests/visual/artifacts/resume-topbar.actual.png
          cp tests/visual/artifacts/home-hero.actual.png tests/visual/baseline/linux/home-hero.png
          cp tests/visual/artifacts/resume-topbar.actual.png tests/visual/baseline/linux/resume-topbar.png
          npm run test:visual
      - name: Commit reviewed Linux screenshot references
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual/baseline/linux/home-hero.png tests/visual/baseline/linux/resume-topbar.png
          if ! git diff --cached --quiet; then
            git commit -m "test(visual): update reviewed hero and CV header baselines"
            git push origin HEAD:feature/refresh-online-cv-and-profile-nov2026
          fi
