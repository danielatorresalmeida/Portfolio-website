name: Temporary regenerate updated skills
on:
  push:
    branches:
      - fix/classify-verified-api-and-testing-skills
    paths:
      - .github/workflows/temp-regenerate-skills.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/classify-verified-api-and-testing-skills
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Build from shared skills source
        run: |
          npm run build:resumes
          npm run build:profile
      - name: Validate generated pages
        run: |
          npm test
          npm run validate:links
      - name: Commit updated bilingual pages and CVs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html home/index.html script.js resume-site-only/index.html resume/variants
          if ! git diff --cached --quiet; then
            git commit -m "build: update bilingual website and CV skill categories"
            git push origin HEAD:fix/classify-verified-api-and-testing-skills
          fi
